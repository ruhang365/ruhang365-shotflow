[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ruhang365-shotflow"
version = "0.4.1"
description = "Turn an accepted AI-video final frame and one sentence into a Seedance continuity Prompt."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE.md"]
authors = [
  {name = "Ruhang365"}
]
keywords = [
  "ai-video",
  "cinematic-continuity",
  "seedance",
  "skill",
  "shot-planning",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = []

[project.scripts]
shotflow = "shotflow.cli:main"

[project.urls]
Homepage = "https://github.com/ruhang365/ruhang365-shotflow"
Repository = "https://github.com/ruhang365/ruhang365-shotflow"
Issues = "https://github.com/ruhang365/ruhang365-shotflow/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
