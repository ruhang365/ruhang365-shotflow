name: ShotFlow showcase
description: Share a final-frame-to-Prompt workflow or a real two-shot result
title: "[Showcase] "
labels: ["showcase", "evidence"]
body:
  - type: markdown
    attributes:
      value: |
        Do not upload private media, credentials, account links, or unlicensed assets.
  - type: input
    id: public_url
    attributes:
      label: Optional public work URL
      description: Leave blank for a Prompt-only workflow.
  - type: input
    id: version
    attributes:
      label: ShotFlow version or commit
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent host and model
    validations:
      required: true
  - type: textarea
    id: intent
    attributes:
      label: Final-frame facts and next-shot intent
      description: Describe only shareable visible facts; do not attach private media.
    validations:
      required: true
  - type: textarea
    id: prompt
    attributes:
      label: ShotFlow Prompt and limitations
      description: State whether generation was submitted. A/B evidence is optional and must not be implied when absent.
    validations:
      required: true
  - type: checkboxes
    id: rights
    attributes:
      label: Rights and disclosure
      options:
        - label: I have the right to share every submitted asset or description.
          required: true
        - label: I disclosed any AI provider used and preserved required AI labels.
          required: true
